{% extends "base.html" %}{% block title %}Add Lesson — Admin{% endblock %}
{% block content %}<section class="container form-page"><a class="back-link" href="{{ url_for('admin_dashboard') }}">← Admin dashboard</a><div class="form-panel"><div class="eyebrow">LESSON MANAGEMENT</div><h1>Add a <span class="gradient-text">lesson.</span></h1><p>Course: <strong>{{ course.title }}</strong></p><form method="post" class="stack-form"><label>Lesson title<input name="title" required placeholder="e.g. Variables in Python"></label><label>Lesson content<textarea name="content" required rows="7" placeholder="Write lesson notes, examples and practice tasks..."></textarea></label><label>Video embed URL <input type="url" name="video_url" placeholder="https://www.youtube.com/embed/VIDEO_ID"><small>Optional. Use an embed URL, not a normal watch URL.</small></label><label>PDF notes URL <input type="url" name="notes_url" placeholder="https://example.com/notes.pdf"><small>Optional. Add a publicly accessible PDF link; leave blank if you will upload notes later.</small></label><div class="form-grid"><label>Video access price (₹)<input type="number" name="video_price" min="0" step="1" value="0" required><small>0 = free. Students pay separately for video access.</small></label><label>PDF notes price (₹)<input type="number" name="notes_price" min="0" step="1" value="0" required><small>0 = free. PDF notes can have a different price.</small></label></div><label class="checkbox-label"><input type="checkbox" name="is_preview"> Make this a free preview lesson</label><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('admin_dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit">Add lesson ↗</button></div></form></div></section>{% endblock %}
