{% extends "base.html" %}{% block title %}Add Course — Admin{% endblock %}
{% block content %}<section class="container form-page"><a class="back-link" href="{{ url_for('admin_dashboard') }}">← Admin dashboard</a><div class="form-panel"><div class="eyebrow">COURSE MANAGEMENT</div><h1>Create a <span class="gradient-text">course.</span></h1><p>Add a course to the public learning library.</p><form method="post" class="stack-form"><label>Course title<input name="title" required placeholder="e.g. Python for Beginners"></label><div class="form-two-col"><label>Category<input name="category" required placeholder="Programming"></label><label>Level<select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></div><label>Description<textarea name="description" required rows="4" placeholder="What will students learn?"></textarea></label><label>Price in INR<input type="number" name="price" min="0" step="1" value="0" required><small>Use 0 for a free course. Paid checkout is not integrated.</small></label><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('admin_dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit">Create course ↗</button></div></form></div></section>{% endblock %}
